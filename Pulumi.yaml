name: pulumi-sqs-lambda-worker
description: SQS -> container Lambda -> S3 worker (example job - image thumbnails)
main: infra/
runtime:
  name: python
  options:
    toolchain: uv
config:
  outputPrefix:
    type: string
    default: images/
  allowedHosts:
    type: string
    default: upload.wikimedia.org
  thumbnailWidths:
    type: string
    default: "320,640,1280"
  architecture:
    type: string
    default: x86_64

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", resolution: "lowest-direct" }
          - { python: "3.12", resolution: "highest" }
          - { python: "3.13", resolution: "highest" }
    name: test (py${{ matrix.python }}, ${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          uv run --isolated --python ${{ matrix.python }} --resolution ${{ matrix.resolution }}
          pytest --cov=thumbnailer --cov=sqs_lambda_worker --cov-report=term-missing

  container:
    # Build the Lambda image and invoke it through the Runtime Interface Emulator,
    # with moto for S3/SQS. --limit 0 sends only the "host not allowed" message,
    # so CI does not download anything from Wikimedia.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --build --wait
      - run: uv run python scripts/local_demo.py --limit 0 | tee demo.log
      - run: grep -q '1 message(s) in the DLQ' demo.log
      - if: always()
        run: docker compose logs worker && docker compose down

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pulumi/actions@v6
      - run: uv sync --locked
      - run: scripts/preview_offline.sh
